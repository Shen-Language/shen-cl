name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to verify (blank = selected branch; never publishes)'
        required: false

permissions:
  contents: write

env:
  # shen-cl is self-hosting: building it requires an existing Shen
  # executable to precompile the kernel and compiler down to Lisp (`make
  # precompile`). We bootstrap from a previously released prebuilt binary for
  # the same platform. Repoint these at an upstream release once one exists.
  BOOTSTRAP_REPO: pyrex41/shen-cl
  BOOTSTRAP_TAG: v3.0.4

jobs:
  build:
    name: Build ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-14
            platform: macos-arm64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check release version
        shell: bash
        env:
          BUILD_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          PORT_VERSION="$(sed -n 's/^(defvar |\*port\*| "\([^"]*\)")$/\1/p' src/primitives.lsp)"
          if [[ ! "$PORT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid port version: $PORT_VERSION" >&2
            exit 1
          fi
          if [[ -n "$BUILD_TAG" ]]; then
            if [[ "$BUILD_TAG" != "v$PORT_VERSION" ]]; then
              echo "Tag $BUILD_TAG does not match port version $PORT_VERSION" >&2
              exit 1
            fi
            VERSION="$BUILD_TAG"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          echo "PORT_VERSION=$PORT_VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Install SBCL (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends sbcl curl

      - name: Install SBCL (macOS)
        if: runner.os == 'macOS'
        run: brew install sbcl

      - name: Fetch ShenOSKernel 42.2 (SHA-256 verified)
        run: make fetch

      - name: Download bootstrap Shen
        shell: bash
        run: |
          mkdir -p bootstrap
          URL="https://github.com/${BOOTSTRAP_REPO}/releases/download/${BOOTSTRAP_TAG}/shen-cl-${BOOTSTRAP_TAG}-${{ matrix.platform }}-prebuilt.tar.gz"
          echo "Bootstrapping from $URL"
          curl -fsSL -o bootstrap/boot.tar.gz "$URL"
          tar xzf bootstrap/boot.tar.gz -C bootstrap
          BOOT_SHEN="$(find "$PWD/bootstrap" -name shen -type f | head -n1)"
          chmod +x "$BOOT_SHEN"
          echo "BOOT_SHEN=$BOOT_SHEN" >> "$GITHUB_ENV"

      - name: Precompile kernel + compiler
        run: make precompile SHEN="$BOOT_SHEN"

      - name: Build shen-cl
        run: make build-sbcl

      - name: Self-host kernel + compiler
        run: make precompile SHEN=bin/sbcl/shen

      - name: Rebuild shen-cl
        run: make build-sbcl

      - name: Check built version
        run: bin/sbcl/shen eval -e "(cl.exit (if (= (value *port*) \"$PORT_VERSION\") 0 1))"

      - name: Test
        run: make test-all

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          STAGE_PARENT="$(mktemp -d)"
          STAGE_NAME="shen-cl-${VERSION}-${{ matrix.platform }}"
          STAGE="$STAGE_PARENT/$STAGE_NAME"
          mkdir -p "$STAGE"
          cp bin/sbcl/shen "$STAGE/"
          cp LICENSE.txt "$STAGE/"
          cp -R extensions "$STAGE/"
          ARCHIVE="shen-cl-${VERSION}-${{ matrix.platform }}-prebuilt.tar.gz"
          COPYFILE_DISABLE=1 tar -czf "release/$ARCHIVE" -C "$STAGE_PARENT" "$STAGE_NAME"
          ls -la "release/$ARCHIVE"

      - name: Package precompiled sources
        if: matrix.platform == 'linux-x86_64'
        run: make source-release GitVersion="$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          merge-multiple: true

      - name: List artifacts
        run: ls -la release/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            index($0, "## [" version "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No changelog entry for ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" release/* \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
