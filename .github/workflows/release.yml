name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to verify (blank = selected branch; never publishes)'
        required: false

permissions:
  contents: write

env:
  # Temporary until Shen/CL 3.1.0 is published. Then use this repository's
  # release, updating the tag and download asset name along with the repo.
  BOOTSTRAP_REPO: tizoc/shen-scheme
  BOOTSTRAP_TAG: v0.51

jobs:
  precompile:
    name: Precompile portable Lisp
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: ./.github/actions/setup-sbcl

      - name: Fetch ShenOSKernel (SHA-256 verified)
        run: make fetch

      # Shen/Scheme publishes a Linux x64 bootstrap. Generate portable Lisp
      # once, then build it natively on every release platform.
      - name: Download bootstrap Shen
        shell: bash
        run: |
          mkdir -p bootstrap
          URL="https://github.com/${BOOTSTRAP_REPO}/releases/download/${BOOTSTRAP_TAG}/shen-scheme-${BOOTSTRAP_TAG}-linux-x64-bin.tar.gz"
          curl -fsSL -o bootstrap/boot.tar.gz "$URL"
          tar xzf bootstrap/boot.tar.gz -C bootstrap
          BOOT_SHEN="$(find "$PWD/bootstrap" -name shen-scheme -type f | head -n1)"
          test -n "$BOOT_SHEN"
          chmod +x "$BOOT_SHEN"
          echo "BOOT_SHEN=$BOOT_SHEN" >> "$GITHUB_ENV"

      - name: Precompile kernel + compiler
        run: make precompile SHEN="$BOOT_SHEN"

      - name: Build bootstrap shen-cl
        run: make build-sbcl

      - name: Self-host kernel + compiler
        run: make precompile SHEN=bin/sbcl/shen

      - name: Upload precompiled kernel
        uses: actions/upload-artifact@v4
        with:
          name: precompiled-kernel
          path: |
            compiled/
            kernel/
          if-no-files-found: error

  build:
    name: Build ${{ matrix.platform }}
    needs: precompile
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux-x86_64
          - os: ubuntu-24.04-arm
            platform: linux-aarch64
          - os: macos-14
            platform: macos-arm64
          - os: windows-2022
            platform: windows-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Keep source line endings (Windows)
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Check release version
        shell: bash
        env:
          BUILD_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
        run: |
          PORT_VERSION="$(sed -n 's/^(defvar |\*port\*| "\([^"]*\)")$/\1/p' src/primitives.lsp)"
          if [[ ! "$PORT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid port version: $PORT_VERSION" >&2
            exit 1
          fi
          if [[ -n "$BUILD_TAG" ]]; then
            if [[ "$BUILD_TAG" != "v$PORT_VERSION" ]]; then
              echo "Tag $BUILD_TAG does not match port version $PORT_VERSION" >&2
              exit 1
            fi
            VERSION="$BUILD_TAG"
          else
            VERSION="$(git rev-parse --short HEAD)"
          fi
          echo "PORT_VERSION=$PORT_VERSION" >> "$GITHUB_ENV"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

      - uses: ./.github/actions/setup-sbcl

      - name: Download precompiled kernel
        uses: actions/download-artifact@v4
        with:
          name: precompiled-kernel

      - name: Build shen-cl
        # Keep Git Bash from converting the make variable's slash to a path.
        run: MSYS2_ARG_CONV_EXCL='Slash=' make SHELL=bash Slash=/ build-sbcl

      - name: Check built version
        run: |
          SHEN=bin/sbcl/shen
          if [[ "$RUNNER_OS" == Windows ]]; then SHEN="$SHEN.exe"; fi
          "$SHEN" eval -e "(cl.exit (if (= (value *port*) \"$PORT_VERSION\") 0 1))"

      - name: Test
        run: MSYS2_ARG_CONV_EXCL='Slash=' make SHELL=bash Slash=/ test-all

      - name: Package
        shell: bash
        run: |
          mkdir -p release
          STAGE_PARENT="$(mktemp -d)"
          STAGE_NAME="shen-cl-${VERSION}-${{ matrix.platform }}"
          STAGE="$STAGE_PARENT/$STAGE_NAME"
          mkdir -p "$STAGE"
          EXE=shen
          if [[ "$RUNNER_OS" == Windows ]]; then EXE=shen.exe; fi
          cp "bin/sbcl/$EXE" "$STAGE/"
          cp LICENSE.txt "$STAGE/"
          cp -R extensions "$STAGE/"
          if [[ "$RUNNER_OS" == Windows ]]; then
            ARCHIVE="shen-cl-${VERSION}-${{ matrix.platform }}-prebuilt.zip"
            7z a -tzip "release/$ARCHIVE" "$STAGE"
          else
            ARCHIVE="shen-cl-${VERSION}-${{ matrix.platform }}-prebuilt.tar.gz"
            COPYFILE_DISABLE=1 tar -czf "release/$ARCHIVE" -C "$STAGE_PARENT" "$STAGE_NAME"
          fi
          ls -la "release/$ARCHIVE"
          ARCHIVE_PATH="$PWD/release/$ARCHIVE"
          SMOKE="$(mktemp -d)"
          if [[ "$RUNNER_OS" == Windows ]]; then
            (cd "$SMOKE" && 7z x "$ARCHIVE_PATH")
          else
            tar xzf "$ARCHIVE_PATH" -C "$SMOKE"
          fi
          cd "$SMOKE/$STAGE_NAME"
          env -u SBCL_HOME "./$EXE" eval -e "(cl.exit (if (= (value *port*) \"$PORT_VERSION\") 0 1))"
          env -u SBCL_HOME "./$EXE" script extensions/sha256/tests.shen

      - name: Package precompiled sources
        if: matrix.platform == 'linux-x86_64'
        run: make source-release GitVersion="$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}-release
          path: release/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: release
          pattern: '*-release'
          merge-multiple: true

      - name: List artifacts
        run: ls -la release/

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v version="${GITHUB_REF_NAME#v}" '
            index($0, "## [" version "]") == 1 { found=1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "No changelog entry for ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          gh release create "${GITHUB_REF_NAME}" release/* \
            --verify-tag \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
