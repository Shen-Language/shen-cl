name: Port Tests

# Builds and self-hosts shen-cl on SBCL, then runs the canonical kernel
# certification suite and the port-authored test suites:
#   - make test-sbcl     : canonical kernel certification suite
#   - make test-compiler : existing KL->Lisp compiler-output golden tests
#   - make test-port     : tests/*-tests.shen runtime regression suite
#   - make test-cli      : scripts/test-cli.sh CLI/launcher parity (SBCL here;
#                          locally it also exercises clisp + ecl when built)

on:
  push:
    branches: [ master, 'kernel-*' ]
  pull_request:
  workflow_dispatch:

env:
  # Temporary until Shen/CL 3.1.0 is published. Then use this repository's
  # release, updating the tag and download asset name along with the repo.
  BOOTSTRAP_REPO: tizoc/shen-scheme
  BOOTSTRAP_TAG: v0.51

jobs:
  port-tests:
    name: Port tests (SBCL)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-sbcl

      - name: Fetch ShenOSKernel (SHA-256 verified)
        run: make fetch

      - name: Download bootstrap Shen
        shell: bash
        run: |
          mkdir -p bootstrap
          URL="https://github.com/${BOOTSTRAP_REPO}/releases/download/${BOOTSTRAP_TAG}/shen-scheme-${BOOTSTRAP_TAG}-linux-x64-bin.tar.gz"
          echo "Bootstrapping from $URL"
          curl -fsSL -o bootstrap/boot.tar.gz "$URL"
          tar xzf bootstrap/boot.tar.gz -C bootstrap
          BOOT_SHEN="$(find "$PWD/bootstrap" -name shen-scheme -type f | head -n1)"
          test -n "$BOOT_SHEN"
          chmod +x "$BOOT_SHEN"
          echo "BOOT_SHEN=$BOOT_SHEN" >> "$GITHUB_ENV"

      - name: Precompile kernel + compiler
        run: make precompile SHEN="$BOOT_SHEN"

      - name: Build shen-cl (SBCL)
        run: make build-sbcl

      - name: Self-host kernel + compiler
        run: make precompile SHEN=bin/sbcl/shen

      - name: Rebuild shen-cl (SBCL)
        run: make build-sbcl

      - name: Canonical kernel tests
        run: make test-sbcl

      - name: Compiler tests (existing)
        run: make test-compiler

      - name: Port runtime tests
        run: make test-port

      - name: CLI / launcher parity tests
        run: make test-cli

      - name: Kernel extension tests
        run: make test-extensions

      - name: Accessor and dictionary regression tests
        run: make test-accessors

      - name: Optional SHA-256 extension tests
        run: make test-sha256
